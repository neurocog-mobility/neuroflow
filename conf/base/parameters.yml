axivity_filepattern:
  dataset: input_axivity_dataset
  pattern: '[misc]_[site]_[subject]_[session]_[misc]_[sensor].cwa'
step_parameters:
  foot_down_time: 0.05
  heel_strike_detect_time: 0.5
  heel_strike_threshold: -5
  pushoff_threshold: 0.75
  pushoff_time: 0.4
  swing_phase_time: 0.2
sync_filepattern:
  dataset: input_sync_dataset
  pattern: '[misc]_[site]_[subject]_[session]_[misc].csv'
