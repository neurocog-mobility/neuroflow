name: Deploy MkDocs Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write   # Grants the GITHUB_TOKEN the permission to deploy to Pages
      id-token: write # Required for deployment

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install MkDocs and any required theme/plugins (e.g., readthedocs theme)
          pip install mkdocs mkdocs-material

      - name: Build MkDocs Site
        run: mkdocs build
      
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact (Built 'site/' folder) 🚀
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
